<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Coston2 transaction signer</title>
<style>body{font:16px system-ui;max-width:760px;margin:2rem auto}code{word-break:break-all}button,select{padding:.7rem;margin:.5rem 0}dt{font-weight:700}dd{margin:0 0 1rem}</style>
<h1>Coston2 transaction signer</h1><p>Choose a generated public sign-request JSON. This page never auto-connects or auto-sends.</p>
<input id="file" type="file" accept="application/json"><label>Wallet <select id="wallet" disabled><option value="">No wallets detected</option></select></label><button id="connect" disabled>Connect wallet</button>
<dl><dt>Purpose</dt><dd><code id="purpose">—</code></dd><dt>Signer</dt><dd><code id="signer">—</code></dd><dt>Chain</dt><dd><code id="chain">—</code></dd><dt>Target</dt><dd><code id="target">—</code></dd><dt>Value</dt><dd><code id="value">—</code></dd><dt>Calldata</dt><dd><code id="data">—</code></dd><dt>Calldata hash</dt><dd><code id="hash">—</code></dd></dl>
<label><input id="confirm" type="checkbox" disabled> I verified these exact public values.</label><br><button id="send" disabled>Send exactly once</button><p id="result"></p><button id="copy" disabled>Copy transaction hash</button>
<script>
const $=id=>document.getElementById(id), providers=new Map(), coston2Rpc='https://coston2-api.flare.network/ext/C/rpc', coston2Network={chainId:'0x72',chainName:'Flare Testnet Coston2',nativeCurrency:{name:'Coston2 Flare',symbol:'C2FLR',decimals:18},rpcUrls:[coston2Rpc],blockExplorerUrls:['https://coston2-explorer.flare.network']}; let request=null, account=null, verified=false, sent=false, txHash='', selectedProvider=null, contextEpoch=0, connectingContext=null, expectedChainContext=null;
const fields=['version','purpose','chain_id','signer','to','value','data','calldata_hash'], address=value=>typeof value==='string'&&/^0x[0-9a-f]{40}$/i.test(value), hex=value=>typeof value==='string'&&/^0x(?:[0-9a-f]{2})*$/i.test(value), quantity=value=>typeof value==='string'&&/^0x(?:0|[1-9a-f][0-9a-f]*)$/.test(value);
function resetVerification(message){verified=false;account=null;$('confirm').checked=false;$('confirm').disabled=true;$('send').disabled=true;if(message)$('result').textContent=message}
function fail(message){resetVerification(message)}
function advanceContext(message){contextEpoch+=1;resetVerification(message);return contextEpoch}
function guardKey(value){return 'phase0-submission:'+value.chain_id+':'+value.signer.toLowerCase()+':'+value.to.toLowerCase()+':'+value.value.toLowerCase()+':'+value.calldata_hash.toLowerCase()}
function storedSubmission(key){try{return localStorage.getItem(key)}catch(error){throw Error('Submission guard storage is unavailable; do not submit')}}
function rememberSubmission(key,value){try{localStorage.setItem(key,value)}catch(error){throw Error('Submission guard storage is unavailable; do not submit')}}
function clearRejectedSubmission(key){try{localStorage.removeItem(key)}catch(error){throw Error('Submission guard storage is unavailable')}}
function submittedHash(value){const hash=typeof value==='string'&&value.startsWith('submitted:')?value.slice(10):'';return /^0x[0-9a-f]{64}$/i.test(hash)?hash:''}
function validText(value){return typeof value==='string'&&value.length>0&&value.length<=256}
function addWalletOption(wallet,id,item){const option=document.createElement('option');option.value=id;option.textContent=item.name;wallet.appendChild(option)}
function addProvider(detail){if(!detail||typeof detail!=='object'||!detail.info||!detail.provider)return;const {info,provider}=detail;if(!validText(info.uuid)||!validText(info.name)||!validText(info.rdns)||typeof provider.request!=='function'||providers.has(info.uuid)||[...providers.values()].some(item=>item.provider===provider))return;const item={id:info.uuid,provider,name:info.name};providers.set(info.uuid,item);if(selectedProvider)addWalletOption($('wallet'),info.uuid,item);else renderWallets()}
function renderWallets(){const wallet=$('wallet');wallet.options.length=0;const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent=providers.size?'Choose a wallet':'No wallets detected';wallet.appendChild(placeholder);for(const [id,item] of providers)addWalletOption(wallet,id,item);wallet.disabled=!providers.size;wallet.value='';selectedProvider=null;advanceContext(providers.size?'Choose a wallet.':'No wallets detected.');updateConnect()}
function updateConnect(){$('connect').disabled=!providers.size||!!connectingContext&&isCurrent(connectingContext)}
function selectProvider(){const item=providers.get($('wallet').value);selectedProvider=item||null;advanceContext(selectedProvider?'Selected wallet. Connect to verify.':'Choose a wallet.');updateConnect();if(selectedProvider&&typeof selectedProvider.provider.on==='function'){selectedProvider.provider.on('accountsChanged',()=>{if(selectedProvider===item)advanceContext('Wallet account changed; reconnect and verify again.')});selectedProvider.provider.on('chainChanged',chain=>{if(selectedProvider===item&&!(expectedChainContext&&expectedChainContext.entry===item&&isCurrent(expectedChainContext)&&chain==='0x72'))advanceContext('Stale context; reconnect and verify again.')})}}
function addLegacyProviders(){const legacy=window.ethereum&&Array.isArray(window.ethereum.providers)?window.ethereum.providers:(window.ethereum?[window.ethereum]:[]);legacy.forEach((provider,index)=>addProvider({info:{uuid:'legacy-'+index,name:'Legacy wallet '+(index+1),rdns:'legacy.local'},provider}))}
function validate(value){if(!value||typeof value!=='object'||Array.isArray(value)||Object.keys(value).length!==fields.length||fields.some(key=>!Object.prototype.hasOwnProperty.call(value,key)))throw Error('Request must contain exactly the required public fields');if(fields.some(key=>typeof value[key]!=='string'))throw Error('Request fields must be strings');if(value.version!=='1'||value.chain_id!=='0x72'||!['fdc-request','execute-direct-mint','deploy-product-contracts','fund-test-liquidity'].includes(value.purpose)||!address(value.signer)||!address(value.to)||!quantity(value.value)||!hex(value.data)||!/^0x[0-9a-f]{64}$/i.test(value.calldata_hash))throw Error('Invalid public sign request');return value}
function render(value){[['purpose','purpose'],['signer','signer'],['chain','chain_id'],['target','to'],['value','value'],['data','data'],['hash','calldata_hash']].forEach(([id,key])=>$(id).textContent=value[key]);resetVerification('Request loaded. Choose a wallet, then connect to verify.');updateConnect()}
function captureContext(){if(!selectedProvider||!request)throw Error('Choose a wallet');return {epoch:contextEpoch,entry:selectedProvider,provider:selectedProvider.provider,request,key:guardKey(request)}}
function captureCopyContext(){if(!request||!txHash)throw Error('No transaction hash available');return {epoch:contextEpoch,request,hash:txHash}}
function sameRequest(value){return request===value&&fields.every(key=>request[key]===value[key])}
function isCurrent(context){return context.epoch===contextEpoch&&context.entry===selectedProvider&&context.provider===selectedProvider?.provider&&sameRequest(context.request)}
function isCurrentCopy(context){return context.epoch===contextEpoch&&sameRequest(context.request)&&txHash===context.hash}
function assertCurrent(context){if(!isCurrent(context))throw Error('Stale context; reconnect and verify again.')}
function handleFailure(error,context){if(context&&!isCurrent(context))return;if(error&&error.message==='Stale context; reconnect and verify again.')advanceContext(error.message);else fail(error?.message||'Wallet operation failed')}
function approvalError(error){return String(error?.code)==='4001'?Error('Coston2 approval was rejected.'):Error('Coston2 approval failed; reconnect and try again.')}
async function readChain(context){const chain=await context.provider.request({method:'eth_chainId'});assertCurrent(context);return chain}
async function requestCoston2Approval(context){const switchChain=async()=>{await context.provider.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x72'}]});assertCurrent(context)};try{await switchChain()}catch(error){if(String(error?.code)!=='4902')throw approvalError(error);try{await context.provider.request({method:'wallet_addEthereumChain',params:[coston2Network]});assertCurrent(context);if(await readChain(context)!=='0x72')await switchChain()}catch(approval){throw approvalError(approval)}}if(await readChain(context)!=='0x72')throw Error('Wallet must use Coston2 (0x72)')}
function unsupportedSha3(error){if(String(error?.code)==='-32601'||String(error?.code)==='4200')return true;if(error?.code!==undefined||typeof error?.message!=='string')return false;const message=error.message.toLowerCase();return /web3_sha3/.test(message)&&!/(timeout|timed out|transport|internal|permission)/.test(message)&&(/method\s*\[?web3_sha3\]?.*(corresponding handler|not found|unsupported)/.test(message)||/web3_sha3.*method not found/.test(message))}
function rpcFailure(error){return Error(error?.name==='AbortError'?'Official Coston2 calldata hash verification failed: timed out.':'Official Coston2 calldata hash verification failed.')}
async function officialSha3(context){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),5000);try{const response=await fetch(coston2Rpc,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'web3_sha3',params:[context.request.data]}),credentials:'omit',signal:controller.signal});assertCurrent(context);if(!response.ok)throw Error('HTTP');const payload=await response.json();assertCurrent(context);if(!payload||typeof payload!=='object'||Array.isArray(payload)||payload.jsonrpc!=='2.0'||payload.id!==1||Object.prototype.hasOwnProperty.call(payload,'error')||!Object.prototype.hasOwnProperty.call(payload,'result')||typeof payload.result!=='string'||!/^0x[0-9a-f]{64}$/i.test(payload.result)||payload.result.toLowerCase()!==context.request.calldata_hash.toLowerCase())throw Error('response');return payload.result}catch(error){throw rpcFailure(error)}finally{clearTimeout(timeout)}}
async function verifiedHash(context){try{const hash=await context.provider.request({method:'web3_sha3',params:[context.request.data]});assertCurrent(context);return hash}catch(error){if(!unsupportedSha3(error))throw error;return officialSha3(context)}}
async function verifyProvider(context,connect){assertCurrent(context);const accounts=connect?await context.provider.request({method:'eth_requestAccounts'}):null;assertCurrent(context);const chain=await readChain(context);if(chain!=='0x72'){if(!connect)throw Error('Wallet must use Coston2 (0x72)');expectedChainContext=context;$('result').textContent='Requesting Coston2 approval…';await requestCoston2Approval(context)}const selectedAccounts=accounts||await context.provider.request({method:'eth_accounts'});assertCurrent(context);const selected=selectedAccounts[0]?.toLowerCase();if(selected!==context.request.signer.toLowerCase())throw Error('Selected account does not match request signer');const hash=await verifiedHash(context);assertCurrent(context);if(typeof hash!=='string'||hash.toLowerCase()!==context.request.calldata_hash.toLowerCase())throw Error('Provider calldata hash mismatch');return selected}
function readyToSend(context,capturedAccount){return isCurrent(context)&&verified&&account===capturedAccount&&$('confirm').checked&&!sent}
$('wallet').onchange=selectProvider;$('file').onchange=async event=>{const loadingEpoch=advanceContext('Loading sign request.');request=null;sent=false;txHash='';$('copy').disabled=true;updateConnect();try{const value=validate(JSON.parse(await event.target.files[0].text()));if(loadingEpoch!==contextEpoch)throw Error('Stale context; reconnect and verify again.');const stored=storedSubmission(guardKey(value)),hash=submittedHash(stored);if(stored&&!hash)throw Error('This exact request may already have been submitted; verify wallet or explorer before continuing.');request=Object.freeze({...value});render(request);if(hash){sent=true;txHash=hash;$('copy').disabled=false;$('result').textContent='Recovered submitted public transaction hash: '+hash}}catch(error){if(loadingEpoch===contextEpoch){request=null;fail(error.message);updateConnect()}}};
$('connect').onclick=async()=>{if(connectingContext&&isCurrent(connectingContext))return;if(!request){fail('Load sign-request JSON first.');return}if(!selectedProvider){fail('Choose a wallet first.');return}let context=null;try{context=captureContext();connectingContext=context;updateConnect();$('result').textContent='Opening '+context.entry.name+'…';const selected=await verifyProvider(context,true);assertCurrent(context);account=selected;verified=true;$('confirm').disabled=false;$('result').textContent='Wallet, Coston2 chain, and calldata hash verified.'}catch(error){handleFailure(error,context)}finally{if(expectedChainContext===context)expectedChainContext=null;if(connectingContext===context)connectingContext=null;updateConnect()}};$('confirm').onchange=()=>{$('send').disabled=!$('confirm').checked||!verified||!account||sent};
$('send').onclick=async()=>{let context=null,guarded=false,returnedHash='';try{context=captureContext();const capturedAccount=account;if(!readyToSend(context,capturedAccount))throw Error('Explicit confirmation after verification is required');const checked=await verifyProvider(context,false);assertCurrent(context);if(checked!==capturedAccount)throw Error('Selected account changed');if(!readyToSend(context,capturedAccount))throw Error('Stale context; reconnect and verify again.');if(storedSubmission(context.key))throw Error('This exact request may already have been submitted; verify wallet or explorer before continuing.');rememberSubmission(context.key,'pending');guarded=true;sent=true;$('send').disabled=true;const hash=await context.provider.request({method:'eth_sendTransaction',params:[{from:capturedAccount,to:context.request.to,value:context.request.value,data:context.request.data}]});if(typeof hash!=='string'||!/^0x[0-9a-f]{64}$/i.test(hash))throw Error('Wallet returned an invalid transaction hash');returnedHash=hash;rememberSubmission(context.key,'submitted:'+hash.toLowerCase());if(isCurrent(context)){txHash=hash;$('result').textContent='Submitted public transaction hash: '+hash;$('copy').disabled=false}}catch(error){if(guarded&&error&&error.code===4001){try{clearRejectedSubmission(context.key)}catch(clearError){if(isCurrent(context)){sent=true;resetVerification('Pending submission guard could not be cleared; do not retry; verify wallet or explorer.')}return}if(isCurrent(context)){sent=false;resetVerification('Wallet rejected before submission. Reconnect and verify to try again.')}}else if(guarded){if(isCurrent(context)){if(returnedHash){txHash=returnedHash;$('copy').disabled=false;$('result').textContent='Transaction submitted; guard update failed; do not retry; verify wallet or explorer: '+returnedHash}else fail('Submission status unknown; do not retry; verify wallet or explorer.')}}else handleFailure(error,context)}};$('copy').onclick=async()=>{let context=null,copiedHash='';try{context=captureCopyContext();copiedHash=txHash;await navigator.clipboard.writeText(copiedHash);if(isCurrentCopy(context))$('result').textContent='Transaction hash copied: '+copiedHash}catch(error){if(!context||isCurrentCopy(context)){if(copiedHash&&txHash===copiedHash)$('result').textContent='Could not copy; transaction remains submitted: '+copiedHash;else fail('Could not copy transaction hash')}}};
window.addEventListener('eip6963:announceProvider',event=>addProvider(event.detail));window.dispatchEvent(new Event('eip6963:requestProvider'));addLegacyProviders();
</script></html>
