name: keep-warm

# Pings the live service so the free-tier instance doesn't sleep (it idles out
# after ~15 min). Runs every 5 minutes and can be triggered manually.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm the service
        run: |
          code=$(curl -s -o /dev/null -m 60 -w "%{http_code}" \
            "https://invoicecraft-e7yg.onrender.com/health" || echo "000")
          echo "GET /health -> $code"
