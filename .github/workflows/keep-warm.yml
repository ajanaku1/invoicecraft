name: keep-warm

# Pings the live service so the free-tier instance doesn't sleep (it idles out
# after ~15 min). Runs every 5 minutes and can be triggered manually.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm the service
        run: |
          for path in /health "/api/v1/invoice"; do
            code=$(curl -s -o /dev/null -m 60 -w "%{http_code}" -X POST \
              "https://invoicecraft-e7yg.onrender.com$path" \
              -H "Content-Type: application/json" -d '{}' || echo "000")
            echo "$path -> $code"
          done
