services:
  - type: web
    name: invoicecraft
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # The OKX Payment SDK requires Python >= 3.11.
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ASP_WALLET
        sync: false
      # Official OKX Onchain OS Payment SDK credentials (dev portal:
      # https://web3.okx.com/onchainos/dev-portal). All three must be set or the
      # service falls back to its built-in x402 challenge.
      - key: OKX_API_KEY
        sync: false
      - key: OKX_SECRET_KEY
        sync: false
      - key: OKX_PASSPHRASE
        sync: false
      - key: INVOICE_ISSUER_NAME
        value: InvoiceCraft AI
      - key: INVOICE_ISSUER_EMAIL
        value: invoice@craft.dev
      - key: TAX_RATE
        value: "0.08"
      # Payment verification: "mock" (demo, accepts well-formed tx hashes) or
      # "onchain" (real USDT verification via web3 — requires the vars below).
      - key: PAYMENT_VERIFY_MODE
        value: mock
      - key: XLAYER_RPC
        sync: false
      - key: USDT_CONTRACT
        sync: false
      # AI parsing: set LLM_API_KEY to enable LLM line-item extraction.
      # Without it, the service uses the built-in heuristic parser.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-sonnet-5
